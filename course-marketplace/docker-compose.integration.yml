
services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coursehub_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U testuser -d coursehub_test
      interval: 3s
      timeout: 3s
      retries: 20

  integration:
    build: ./backend
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://testuser:testpass@db_test:5432/coursehub_test
      JWT_ACCESS_SECRET: integration-access-secret
      JWT_REFRESH_SECRET: integration-refresh-secret
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      db_test:
        condition: service_healthy
    command:
      - sh
      - -c
      - npm run migrate && npx vitest run src/tests/integration.test.ts
